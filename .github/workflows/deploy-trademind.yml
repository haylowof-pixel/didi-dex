name: Deploy TradeMind to GitHub Pages

# NOTE: TradeMind is now bundled into the main "Deploy web" workflow (pages.yml)
# at /trademind/ to avoid two workflows fighting over the same GitHub Pages site.
# This workflow is kept for manual standalone deploys only.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload trading-tool as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: trading-tool

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
