name: Build TradeMind APK

on:
  push:
    branches: [master]
    paths: ['trading-tool/**']
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor locally
        working-directory: trading-tool
        run: npm install @capacitor/cli @capacitor/core @capacitor/android @capacitor/splash-screen @capacitor/status-bar

      - name: Prepare www folder (Capacitor webDir)
        working-directory: trading-tool
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/ 2>/dev/null || true
          cp sw.js www/ 2>/dev/null || true

      - name: Add Android platform
        working-directory: trading-tool
        run: npx cap add android || true

      - name: Sync Capacitor
        working-directory: trading-tool
        run: npx cap sync android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        working-directory: trading-tool/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: trading-tool/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradeMind-debug-apk
          path: trading-tool/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Get short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ steps.sha.outputs.short }}
          name: TradeMind APK (${{ steps.sha.outputs.short }})
          body: |
            ## TradeMind Android APK

            Télécharge et installe `app-debug.apk` sur ton Android.

            > Active "Sources inconnues" dans Paramètres → Sécurité avant d'installer.
          files: trading-tool/android/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
