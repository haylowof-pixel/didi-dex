<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quick Lookup</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg-deep:    #07070f;
    --bg-panel:   rgba(12, 12, 24, 0.97);
    --border:     rgba(123, 147, 248, 0.18);
    --border-hi:  rgba(123, 147, 248, 0.45);
    --accent:     #7B93F8;
    --accent-dim: rgba(123, 147, 248, 0.12);
    --green:      #2dd4a0;
    --red:        #ef5f5f;
    --orange:     #f0993e;
    --text-1:     #f0f0ff;
    --text-2:     #9090b8;
    --text-3:     #5a5a80;
    --radius:     14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: transparent;
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--text-1);
    overflow: hidden;
    margin: 0; padding: 0;
    width: 520px;
  }

  /* ── Panel fills the window exactly — no padding, no extra space ── */
  #panel {
    width: 520px;
    background: rgba(10, 10, 20, 0.98);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 20px 60px rgba(0,0,0,0.9), 0 0 0 1px rgba(123,147,248,0.06);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Search bar ── */
  #search-row {
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    height: 54px;
    flex-shrink: 0;
  }
  #search-icon {
    color: var(--text-3);
    flex-shrink: 0;
    width: 18px; height: 18px;
  }
  #search {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-1);
    font-size: 16px;
    font-family: inherit;
    font-weight: 500;
    caret-color: var(--accent);
  }
  #search::placeholder { color: var(--text-3); font-weight: 400; }

  #kbd-hint {
    font-size: 11px;
    color: var(--text-3);
    flex-shrink: 0;
    display: flex;
    gap: 4px;
  }
  kbd {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 10px;
    font-family: inherit;
  }

  /* ── Results list ── */
  #results {
    display: none;
    flex-direction: column;
    border-bottom: 1px solid var(--border);
    max-height: 220px;
    overflow-y: auto;
  }
  #results.visible { display: flex; }
  #results::-webkit-scrollbar { width: 4px; }
  #results::-webkit-scrollbar-track { background: transparent; }
  #results::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .result-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 16px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: background 0.1s, border-color 0.1s;
  }
  .result-item:hover,
  .result-item.focused {
    background: var(--accent-dim);
    border-left-color: var(--accent);
  }
  .result-icon {
    width: 28px; height: 28px;
    border-radius: 6px;
    object-fit: cover;
    background: rgba(255,255,255,0.05);
    flex-shrink: 0;
    filter: brightness(0) invert(1);
    opacity: 0.85;
  }
  .result-icon-fallback {
    width: 28px; height: 28px;
    border-radius: 6px;
    background: rgba(123,147,248,0.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .result-name { font-size: 14px; font-weight: 600; flex: 1; }
  .result-sub  { font-size: 11px; color: var(--text-3); }
  .badge {
    font-size: 10px; font-weight: 600;
    padding: 2px 7px;
    border-radius: 10px;
    flex-shrink: 0;
  }
  .badge-ko  { background: rgba(239,95,95,0.15); color: var(--red); }
  .badge-pas { background: rgba(45,212,160,0.15); color: var(--green); }

  /* ── Taming panel ── */
  #taming-panel {
    display: none;
    flex-direction: column;
    gap: 0;
  }
  #taming-panel.visible { display: flex; }

  /* Dino header */
  #dino-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--border);
  }
  #dino-header-icon {
    width: 38px; height: 38px;
    border-radius: 9px;
    object-fit: cover;
    background: rgba(255,255,255,0.05);
    filter: brightness(0) invert(1);
    opacity: 0.9;
  }
  #dino-header-icon-fb {
    width: 38px; height: 38px;
    border-radius: 9px;
    background: rgba(123,147,248,0.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  #dino-title { font-size: 15px; font-weight: 700; }
  #dino-badge { margin-left: auto; }

  /* Controls */
  #controls {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .ctrl-group {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .ctrl-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  #food-select {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-1);
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    padding: 5px 8px;
    outline: none;
    cursor: pointer;
    max-width: 160px;
  }
  #food-select:focus { border-color: var(--accent); }
  #food-select option { background: #0e0e20; }

  #level-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #level-input {
    width: 52px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-1);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 5px 7px;
    outline: none;
    text-align: center;
  }
  #level-input:focus { border-color: var(--accent); }

  /* Speed multiplier buttons */
  #speed-wrap {
    display: flex;
    gap: 4px;
    margin-left: auto;
  }
  .speed-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text-2);
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 9px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .speed-btn:hover { border-color: var(--border-hi); color: var(--text-1); }
  .speed-btn.active {
    background: rgba(123,147,248,0.18);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Stats grid */
  #stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1px;
    background: var(--border);
    border-top: none;
  }
  .stat-cell {
    background: var(--bg-panel);
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .stat-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .stat-value {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-1);
    line-height: 1.1;
  }
  .stat-sub {
    font-size: 11px;
    color: var(--text-2);
  }
  .stat-value.green { color: var(--green); }
  .stat-value.orange { color: var(--orange); }
  .stat-value.accent { color: var(--accent); }

  /* Food icon */
  #food-icon-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: nowrap;
  }
  #food-icon {
    width: 20px; height: 20px;
    object-fit: contain;
    border-radius: 3px;
    flex-shrink: 0;
    image-rendering: pixelated;
  }

  /* Footer */
  #footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    border-top: 1px solid var(--border);
    gap: 8px;
  }
  #footer-hint { font-size: 11px; color: var(--text-3); display: flex; gap: 10px; }
  #footer-hint span { display: flex; align-items: center; gap: 4px; }
  #starve-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    background: rgba(240,153,62,0.12);
    border: 1px solid rgba(240,153,62,0.35);
    border-radius: 8px;
    color: var(--orange);
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
    white-space: nowrap;
  }
  #starve-btn:hover {
    background: rgba(240,153,62,0.22);
    border-color: rgba(240,153,62,0.6);
  }
  #starve-btn:disabled {
    opacity: 0.35;
    cursor: default;
  }
  #effectiveness-badge {
    font-size: 12px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    background: rgba(45,212,160,0.12);
    color: var(--green);
    margin-left: auto;
  }

  /* Empty state */
  #empty {
    padding: 24px 16px;
    text-align: center;
    color: var(--text-3);
    font-size: 13px;
    display: none;
  }
  #empty.visible { display: block; }
</style>
</head>
<body>

<div id="app">
  <div id="panel">

    <!-- Search -->
    <div id="search-row">
      <svg id="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="search" type="text" placeholder="Search a creature..." autocomplete="off" spellcheck="false"/>
      <div id="kbd-hint"><kbd>↑↓</kbd> navigate &nbsp; <kbd>↵</kbd> select &nbsp; <kbd>Esc</kbd> close</div>
    </div>

    <!-- Results -->
    <div id="results"></div>

    <!-- Empty -->
    <div id="empty">No creature found</div>

    <!-- Taming panel -->
    <div id="taming-panel">
      <div id="dino-header">
        <img id="dino-header-icon" src="" alt="" onerror="this.style.display='none';document.getElementById('dino-header-icon-fb').style.display='flex'"/>
        <div id="dino-header-icon-fb" style="display:none">🦕</div>
        <div>
          <div id="dino-title">—</div>
          <div id="dino-sub" style="font-size:11px;color:var(--text-3);margin-top:2px"></div>
        </div>
        <div id="dino-badge"></div>
      </div>

      <div id="controls">
        <div class="ctrl-group">
          <div class="ctrl-label">Food</div>
          <div id="food-icon-wrap">
            <img id="food-icon" src="" alt="" onerror="this.style.display='none'"/>
            <select id="food-select"></select>
          </div>
        </div>
        <div class="ctrl-group">
          <div class="ctrl-label">Level</div>
          <div id="level-wrap">
            <input id="level-input" type="number" min="1" max="450" value="150"/>
          </div>
        </div>
        <div id="speed-wrap">
          <button class="speed-btn" data-mult="1" onclick="setMult(1)">1×</button>
          <button class="speed-btn" data-mult="2" onclick="setMult(2)">2×</button>
          <button class="speed-btn" data-mult="3" onclick="setMult(3)">3×</button>
          <button class="speed-btn" data-mult="5" onclick="setMult(5)">5×</button>
        </div>
      </div>

      <div id="stats-grid">
        <div class="stat-cell">
          <div class="stat-label">Food needed</div>
          <div class="stat-value" id="stat-food">—</div>
          <div class="stat-sub" id="stat-food-name"></div>
        </div>
        <div class="stat-cell">
          <div class="stat-label">Tame time</div>
          <div class="stat-value accent" id="stat-time">—</div>
          <div class="stat-sub" id="stat-per-food"></div>
        </div>
        <div class="stat-cell">
          <div class="stat-label">Starve timer</div>
          <div class="stat-value orange" id="stat-starve">—</div>
          <div class="stat-sub">before 1st food</div>
        </div>
        <div class="stat-cell">
          <div class="stat-label">Narcotics</div>
          <div class="stat-value" id="stat-narco">—</div>
          <div class="stat-sub" id="stat-narco-sub"></div>
        </div>
        <div class="stat-cell">
          <div class="stat-label">Effectiveness</div>
          <div class="stat-value green" id="stat-eff">—</div>
          <div class="stat-sub" id="stat-bonus"></div>
        </div>
        <div class="stat-cell">
          <div class="stat-label">Max level</div>
          <div class="stat-value" id="stat-maxlvl">—</div>
          <div class="stat-sub">after tame</div>
        </div>
      </div>

      <div id="footer">
        <div id="footer-hint">
          <span><kbd>Tab</kbd> food</span>
          <span><kbd>Esc</kbd> close</span>
        </div>
        <button id="starve-btn" disabled onclick="sendStarveTimer()">⏱ Starve timer</button>
        <div id="effectiveness-badge">— %</div>
      </div>
    </div>

  </div>
</div>

<script src="quick-lookup-data.js"></script>
<script>
// ── State ──────────────────────────────────────────
let selectedDino = null;
let focusedIndex = -1;
let currentMult  = 1;
let currentResults = [];

// ── DOM refs ───────────────────────────────────────
const searchEl    = document.getElementById('search');
const resultsEl   = document.getElementById('results');
const emptyEl     = document.getElementById('empty');
const tamingPanel = document.getElementById('taming-panel');

// ── Search ─────────────────────────────────────────
function score(dino, q) {
  const n = dino.name.toLowerCase();
  if (n === q)           return 100;
  if (n.startsWith(q))  return 90;
  if (n.includes(q))    return 70;
  // word match
  const words = q.split(' ').filter(Boolean);
  if (words.length > 1 && words.every(w => n.includes(w))) return 60;
  // subsequence
  let i = 0;
  for (const c of n) { if (c === q[i]) i++; }
  if (i === q.length) return Math.round(30 * (q.length / n.length));
  return 0;
}

function search(q) {
  q = q.trim().toLowerCase();
  if (!q) { hideResults(); return; }

  const scored = dinosaurs
    .map(d => ({ d, s: score(d, q) }))
    .filter(x => x.s > 0)
    .sort((a, b) => b.s - a.s)
    .slice(0, 6)
    .map(x => x.d);

  currentResults = scored;
  focusedIndex = scored.length > 0 ? 0 : -1;
  renderResults(scored);
}

function renderResults(list) {
  resultsEl.innerHTML = '';
  emptyEl.classList.remove('visible');

  if (!list.length) {
    emptyEl.classList.add('visible');
    resultsEl.classList.remove('visible');
    return;
  }

  resultsEl.classList.add('visible');
  list.forEach((dino, i) => {
    const el = document.createElement('div');
    el.className = 'result-item' + (i === focusedIndex ? ' focused' : '');
    el.dataset.index = i;

    const isKO = dino.tamingMethod === 'KNOCKOUT' || dino.tamingMethod === 'KNOCKOUT_PASSIVE';
    const methodLabel = isKO ? 'KO' : 'Passive';
    const methodClass = isKO ? 'badge-ko' : 'badge-pas';

    const iconUrl = getIconUrl(dino);
    const iconHtml = iconUrl
      ? `<img class="result-icon" src="${iconUrl}" alt="" onerror="this.style.display='none'">`
      : `<div class="result-icon-fallback">🦕</div>`;

    el.innerHTML = `
      ${iconHtml}
      <div style="flex:1;min-width:0">
        <div class="result-name">${dino.name}</div>
        <div class="result-sub">${dino.category || 'Creature'}</div>
      </div>
      <span class="badge ${methodClass}">${methodLabel}</span>
    `;
    el.addEventListener('mousedown', (e) => { e.preventDefault(); selectDino(dino); });
    resultsEl.appendChild(el);
  });
}

function hideResults() {
  resultsEl.classList.remove('visible');
  resultsEl.innerHTML = '';
  emptyEl.classList.remove('visible');
  currentResults = [];
  focusedIndex = -1;
}

// ── Creature icon (ported from creatureIcons.js) ────
var ICON_SPECIAL = {
  'Therizinosaurus':    'Therizinosaur',
  'Spinosaurus':        'Spino',
  'Sarcosuchus':        'Sarco',
  'Pulmonoscorpius':    'Scorpion',
  'Castoroides':        'Giant_Beaver',
  'Araneo':             'Spider',
  'Compsognathus':      'Compy',
  'Triceratops':        'Trike',
  'Pachycephalosaurus': 'Pachy',
  'Thylacosmilus':      'Thylacoleo',
  'Sabertooth Salmon':  'Salmon',
  'Megapiranha':        'Piranha',
  'DodoRex':            'Dodorex',
  'Super Turkey':       'Turkey',
  'Royal Griffin':      'Griffin',
  'Quetzalcoatlus':     'Quetzal',
  'Woolly Rhino':       'Woolly_Rhinoceros',
  'Woolly Mammoth':     'Mammoth',
  'Tek Quetzal':        'Tek_Quetzal',
  'X-Woolly Rhino':     'Woolly_Rhinoceros',
  'X-Woolly Mammoth':   'Mammoth',
  'Alpha Rex':          'Rex',
  'Alpha Raptor':       'Raptor',
  'Alpha Carno':        'Carnotaurus',
  'Alpha Mosasaur':     'Mosasaurus',
  'Alpha Tusoteuthis':  'Tusoteuthis',
  'Alpha Leedsichthys': 'Leedsichthys',
  'Alpha Megalodon':    'Megalodon',
  'Zombie Wyvern':      'Wyvern',
  'Skeletal Rex':       'Rex',
  'Bunny Dodo':         'Dodo',
};
var ICON_BASE = {
  'Therizinosaurus':   'Therizinosaur',
  'Spinosaurus':       'Spino',
  'Sarcosuchus':       'Sarco',
  'Pulmonoscorpius':   'Scorpion',
  'Castoroides':       'Giant_Beaver',
  'Araneo':            'Spider',
  'Compsognathus':     'Compy',
  'Triceratops':       'Trike',
  'Pachycephalosaurus':'Pachy',
  'Woolly Rhino':      'Woolly_Rhinoceros',
  'Woolly Mammoth':    'Mammoth',
  'Quetzalcoatlus':    'Quetzal',
};

function resolveVariantName(name) {
  if (name.startsWith('R-')) {
    var base = name.slice(2);
    return ICON_BASE[base] || ICON_SPECIAL[base] || base.replace(/ /g, '_');
  }
  if (name.startsWith('Aberrant ')) {
    var base = name.slice(9);
    return ICON_BASE[base] || ICON_SPECIAL[base] || base.replace(/ /g, '_');
  }
  if (name.startsWith('X-')) {
    if (ICON_SPECIAL[name]) return ICON_SPECIAL[name];
    var base = name.slice(2);
    return ICON_BASE[base] || ICON_SPECIAL[base] || base.replace(/ /g, '_');
  }
  return null;
}

function getIconUrl(dino) {
  var variant = resolveVariantName(dino.name);
  if (variant) return `https://ark.wiki.gg/images/thumb/${variant}.png/64px-${variant}.png`;
  var wikiName = ICON_SPECIAL[dino.name] || dino.name.replace(/ /g, '_');
  return `https://ark.wiki.gg/images/thumb/${wikiName}.png/64px-${wikiName}.png`;
}

function getFoodIconUrl(foodKey) {
  var ft = FOOD_TYPES[foodKey];
  return (ft && ft.icon) ? ft.icon : null;
}

// ── Select dino ─────────────────────────────────────
function selectDino(dino) {
  selectedDino = dino;
  hideResults();
  emptyEl.classList.remove('visible');

  // Update header
  const iconUrl = getIconUrl(dino);
  const imgEl = document.getElementById('dino-header-icon');
  const fbEl  = document.getElementById('dino-header-icon-fb');
  if (iconUrl) {
    imgEl.src = iconUrl;
    imgEl.style.display = '';
    fbEl.style.display = 'none';
  } else {
    imgEl.style.display = 'none';
    fbEl.style.display = 'flex';
  }
  document.getElementById('dino-title').textContent = dino.name;
  document.getElementById('dino-sub').textContent = dino.tamingMethod === 'KNOCKOUT' ? 'Knockout taming' : 'Passive taming';

  const isKO = dino.tamingMethod === 'KNOCKOUT' || dino.tamingMethod === 'KNOCKOUT_PASSIVE';
  document.getElementById('dino-badge').innerHTML =
    `<span class="badge ${isKO ? 'badge-ko' : 'badge-pas'}">${isKO ? 'KO' : 'Passive'}</span>`;

  // Populate food select
  const foodSel = document.getElementById('food-select');
  foodSel.innerHTML = '';
  dino.tamingFoods.forEach(f => {
    const opt = document.createElement('option');
    opt.value = f.food;
    opt.textContent = (FOOD_TYPES[f.food] && FOOD_TYPES[f.food].name) || f.food;
    foodSel.appendChild(opt);
  });

  // Update speed button
  setMult(currentMult, false);

  tamingPanel.classList.add('visible');
  document.getElementById('starve-btn').disabled = true;
  recalculate();

  searchEl.value = dino.name;
}

// ── Calculations ────────────────────────────────────
var _lastResult = null;
function recalculate() {
  if (!selectedDino) return;
  const level   = parseInt(document.getElementById('level-input').value) || 150;
  const foodKey = document.getElementById('food-select').value;

  const r = calculateTaming(selectedDino, level, foodKey, currentMult);
  if (!r) return;
  _lastResult = r;

  document.getElementById('stat-food').textContent      = r.foodNeeded;
  document.getElementById('stat-food-name').textContent = r.foodName;
  document.getElementById('stat-time').textContent      = r.totalTimeFmt;
  document.getElementById('stat-per-food').textContent  = r.secondsPerFood + 's / item';
  document.getElementById('stat-starve').textContent    = r.starveTimeFmt || '—';
  document.getElementById('stat-narco').textContent     = r.narcoticsNeeded || 0;
  document.getElementById('stat-narco-sub').textContent = 'narcotics needed';
  document.getElementById('stat-eff').textContent       = r.effectiveness + '%';
  document.getElementById('stat-bonus').textContent     = '+' + r.bonusLevels + ' bonus levels';
  document.getElementById('stat-maxlvl').textContent    = r.maxLevel;

  const eff = r.effectiveness;
  document.getElementById('effectiveness-badge').textContent = eff + '%';
  document.getElementById('effectiveness-badge').style.color =
    eff >= 95 ? 'var(--green)' : eff >= 70 ? 'var(--orange)' : 'var(--red)';

  // Update food icon
  const foodIconEl = document.getElementById('food-icon');
  const foodIconUrl = getFoodIconUrl(foodKey);
  if (foodIconUrl) {
    foodIconEl.src = foodIconUrl;
    foodIconEl.style.display = '';
  } else {
    foodIconEl.style.display = 'none';
  }

  // Enable starve timer button
  document.getElementById('starve-btn').disabled = !r.starveTimeFmt;
}

// ── Send starve timer to overlay ─────────────────────
function sendStarveTimer() {
  if (!selectedDino || !_lastResult || !window.api) return;
  const data = {
    dinoName: selectedDino.name,
    starveTime: _lastResult.starveTimeFmt || '',
    totalTime: _lastResult.totalTimeFmt || '',
    foodRequired: String(_lastResult.foodNeeded),
    foodCurrent: '',
    foodMax: '',
    torporTime: '',
    torporCurrent: '',
    torporMax: '',
    breeding: null,
    baseStats: {}
  };
  // syncTimerData first (queues it in main if timer not open yet)
  // then open — main flushes the queue on did-finish-load
  window.api.syncTimerData(data);
  window.api.openTimerOverlay();
}

function setMult(m, recalc = true) {
  currentMult = m;
  document.querySelectorAll('.speed-btn').forEach(b => {
    b.classList.toggle('active', parseFloat(b.dataset.mult) === m);
  });
  if (recalc) recalculate();
}

// ── Keyboard navigation ─────────────────────────────
searchEl.addEventListener('input', e => {
  tamingPanel.classList.remove('visible');
  selectedDino = null;
  search(e.target.value);
});

searchEl.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (tamingPanel.classList.contains('visible') || currentResults.length) {
      tamingPanel.classList.remove('visible');
      selectedDino = null;
      hideResults();
      searchEl.value = '';
    } else {
      close();
    }
    return;
  }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (!currentResults.length) return;
    focusedIndex = (focusedIndex + 1) % currentResults.length;
    updateFocus();
  }
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (!currentResults.length) return;
    focusedIndex = (focusedIndex - 1 + currentResults.length) % currentResults.length;
    updateFocus();
  }
  if (e.key === 'Enter') {
    if (focusedIndex >= 0 && currentResults[focusedIndex]) {
      selectDino(currentResults[focusedIndex]);
    }
  }
  if (e.key === 'Tab') {
    e.preventDefault();
    if (!selectedDino) return;
    const sel = document.getElementById('food-select');
    const idx = sel.selectedIndex;
    sel.selectedIndex = (idx + 1) % sel.options.length;
    recalculate();
  }
});

document.getElementById('level-input').addEventListener('input', recalculate);
document.getElementById('food-select').addEventListener('change', recalculate);

function updateFocus() {
  document.querySelectorAll('.result-item').forEach((el, i) => {
    el.classList.toggle('focused', i === focusedIndex);
  });
}

// ── IPC ─────────────────────────────────────────────
function close() {
  if (window.api && window.api.quickLookupClose) {
    window.api.quickLookupClose();
  }
}

if (window.api && window.api.onQuickLookupToggle) {
  window.api.onQuickLookupToggle(() => {
    searchEl.value = '';
    hideResults();
    tamingPanel.classList.remove('visible');
    selectedDino = null;
    searchEl.focus();
  });
}

// ── Auto-resize window to panel content ─────────────
function syncWindowSize() {
  if (!window.api || !window.api.quickLookupResize) return;
  const h = document.getElementById('panel').scrollHeight;
  window.api.quickLookupResize(h);
}

// Observe panel size changes
const ro = new ResizeObserver(() => syncWindowSize());
ro.observe(document.getElementById('panel'));

// Auto-focus on open
window.addEventListener('DOMContentLoaded', () => { searchEl.focus(); syncWindowSize(); });
setTimeout(() => { searchEl.focus(); syncWindowSize(); }, 50);
</script>
