<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Timers</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root {
  --bg-0:#000000;--bg-1:#0a0a0a;--bg-2:#111111;--bg-3:#181818;
  --text-0:#edeef3;--text-1:#b8bac4;--text-2:#7d808e;--text-3:#4e5160;
  --accent:#7B93F8;--accent-l:#97ADFF;--accent-d:#5B75DA;
  --accent-bg:rgba(123,147,248,0.08);--accent-border:rgba(123,147,248,0.22);
  --green:#2dd4a0;--green-bg:rgba(45,212,160,0.08);--green-border:rgba(45,212,160,0.22);
  --red:#ef4444;--red-bg:rgba(239,68,68,0.08);
  --orange:#f59e0b;--orange-bg:rgba(245,158,11,0.08);
  --border-0:rgba(255,255,255,0.04);--border-1:rgba(255,255,255,0.07);--border-2:rgba(255,255,255,0.12);
  --r-sm:6px;--r-md:8px;--r-lg:12px;
  --font:'Inter','Segoe UI Variable','Segoe UI',system-ui,sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  background: transparent;
  font-family: var(--font);
  color: var(--text-1);
  overflow: hidden;
  height: auto;
  width: 240px;
  -webkit-font-smoothing: antialiased;
}

/* shell takes exactly content height */
#shell { height: auto; }

/* ── Shell: widget style ── */
#shell {
  display: flex; flex-direction: column; height: 100%;
  background: rgba(0,0,0,0.88);
  border-radius: var(--r-lg);
  border: 1px solid var(--border-1);
  overflow: hidden;
  -webkit-app-region: drag;
}

/* All interactive elements must opt out of drag */
button, input, select, textarea, .resize-handle, a {
  -webkit-app-region: no-drag;
  cursor: default;
}
button { cursor: pointer; }

/* ── Titlebar — only draggable zone ── */
#mini-bar {
  display: flex; align-items: center;
  height: 30px; padding: 0 8px;
  background: transparent;
  border-bottom: 1px solid var(--border-0);
  -webkit-app-region: drag;
  flex-shrink: 0; gap: 5px;
  cursor: move;
}
#mini-bar .title {
  font-size: 10px; font-weight: 700; color: var(--text-2);
  white-space: nowrap; flex: 1;
  display: flex; align-items: center; gap: 5px;
}
#mini-bar .timer-count {
  font-size: 8px; font-weight: 700; color: var(--text-3);
  padding: 1px 5px; border-radius: 8px;
  background: rgba(255,255,255,0.04);
}
.bar-actions {
  display: flex; align-items: center; gap: 4px;
  margin-left: auto;
}
#mini-bar .close-btn {
  border: none; background: transparent; color: var(--text-3);
  font-size: 12px; cursor: pointer; padding: 2px 6px;
  border-radius: 4px; transition: all .15s; line-height: 1;
}
#mini-bar .close-btn:hover { background: #c42b1c; color: white; }

/* ── Content area — no scroll, grows with content ── */
#timers-area {
  padding: 5px; display: flex; flex-direction: column; gap: 4px;
  cursor: move;
}

/* ══════════════════════════════
   TIMER CARD — widget card style
   ══════════════════════════════ */
.timer-card {
  padding: 7px 8px;
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--border-0);
  border-radius: var(--r-md);
  animation: cardIn .18s ease;
  transition: border-color .2s;
}
.timer-card:hover { border-color: var(--border-1); }
.timer-card.synced { border-color: rgba(45,212,160,0.18) !important; }

@keyframes cardIn {
  from { opacity:0; transform: translateY(4px); }
  to   { opacity:1; transform: translateY(0); }
}

/* Card top row: dino name + badge + remove */
.card-head {
  display: flex; align-items: center; gap: 5px; margin-bottom: 5px;
}
.card-icon {
  width: 20px; height: 20px; border-radius: 4px; object-fit: cover;
  flex-shrink: 0; background: rgba(255,255,255,0.04);
  filter: brightness(0) invert(1);
  opacity: 0.85;
}
.card-icon-fb {
  width: 20px; height: 20px; border-radius: 4px;
  background: rgba(123,147,248,0.1); flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
}
.card-dino {
  font-size: 10px; font-weight: 700; color: var(--text-1);
  flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.card-status {
  font-size: 7px; font-weight: 700; padding: 1px 5px; border-radius: 10px;
  text-transform: uppercase; letter-spacing: 0.3px;
}
.card-status.ready   { background: var(--green-bg); color: var(--green); }
.card-status.running { background: var(--orange-bg); color: var(--orange); }
.card-status.done    { background: var(--red-bg); color: var(--red); }
.card-remove {
  width: 16px; height: 16px; border: none; border-radius: 4px;
  background: transparent; color: var(--text-3); font-size: 10px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all .1s; flex-shrink: 0;
}
.card-remove:hover { background: var(--red-bg); color: var(--red); }

/* Timer rows — like widget timers */
.timer-rows { display: flex; flex-direction: column; gap: 4px; }

.t-row { display: flex; align-items: center; gap: 5px; }
.t-ico  { font-size: 11px; flex-shrink: 0; width: 14px; text-align: center; }
.t-label {
  font-size: 7px; font-weight: 700; color: var(--text-3);
  text-transform: uppercase; width: 30px; flex-shrink: 0;
  letter-spacing: 0.3px;
}
.t-time {
  font-size: 15px; font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.2px; min-width: 60px; color: var(--text-0);
}
.t-time.starve-c { color: var(--green); }
.t-time.torpor-c { color: var(--accent-l); }
.t-time.danger   { color: var(--red) !important; animation: pulse 0.8s ease-in-out infinite; }

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.25} }

/* Progress bar — thin like widget */
.t-bar {
  flex: 1; height: 2px; background: rgba(255,255,255,0.05); border-radius: 2px; overflow: hidden;
}
.t-bar-fill { height: 100%; border-radius: 2px; transition: width 1s linear; }
.t-bar-fill.starve-fill { background: linear-gradient(90deg, rgba(45,212,160,0.2), var(--green)); }
.t-bar-fill.torpor-fill { background: linear-gradient(90deg, rgba(123,147,248,0.2), var(--accent-l)); }

/* Play/pause button */
.t-btn {
  width: 20px; height: 18px; border: 1px solid var(--border-0); border-radius: var(--r-sm);
  background: rgba(255,255,255,0.03); font-size: 9px; font-weight: 700;
  cursor: pointer; font-family: inherit; transition: all .1s;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  color: var(--green);
}
.t-btn:hover    { background: rgba(255,255,255,0.07); }
.t-btn.running  { background: var(--red-bg); color: var(--red); }
.t-btn.torpor-s { color: var(--accent-l); }
.t-btn.torpor-s.running { background: var(--red-bg); color: var(--red); }

/* Narco mini row */
.narco-row {
  display: flex; align-items: center; gap: 3px;
  margin-top: 4px; padding-top: 4px;
  border-top: 1px solid var(--border-0);
}
.narco-btn {
  height: 16px; padding: 0 5px; border: 1px solid var(--border-0); border-radius: 4px;
  background: rgba(255,255,255,0.03); color: var(--accent-l); font-size: 8px; font-weight: 700;
  cursor: pointer; font-family: inherit; transition: all .1s;
  display: flex; align-items: center; gap: 2px;
}
.narco-btn:hover { background: rgba(255,255,255,0.06); }
.narco-count {
  font-size: 8px; font-weight: 800; color: var(--accent);
  min-width: 10px; text-align: center; font-variant-numeric: tabular-nums;
}
.narco-reset-btn {
  width: 16px; height: 16px; border: 1px solid var(--border-0); border-radius: 4px;
  background: transparent; color: var(--text-3); font-size: 8px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  margin-left: auto;
}
.narco-reset-btn:hover { background: rgba(255,255,255,0.06); color: var(--text-2); }

/* ── Empty state ── */
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 14px 10px; text-align: center;
}
.empty-ico   { font-size: 18px; margin-bottom: 5px; opacity: 0.2; }
.empty-title { font-size: 10px; color: var(--text-2); font-weight: 700; margin-bottom: 3px; }
.empty-sub   { font-size: 9px; color: var(--text-3); line-height: 1.5; }

/* ── Add button ── */
.add-row { display: flex; }
.add-btn {
  flex: 1; height: 22px; border: 1px dashed var(--border-1); border-radius: var(--r-sm);
  background: transparent; color: var(--text-3); font-size: 9px; font-weight: 700;
  cursor: pointer; font-family: inherit; transition: all .15s;
  text-transform: uppercase; letter-spacing: 0.4px;
}
.add-btn:hover { border-color: var(--accent-border); color: var(--accent-l); background: var(--accent-bg); }

/* ── Breeding block ── */
.breed-section {
  border-radius: var(--r-md); padding: 7px 8px;
  background: rgba(255,255,255,0.02); border: 1px solid var(--border-0); display: none;
}
.breed-section.show { display: block; }
.breed-head { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
.breed-label { font-size: 10px; font-weight: 700; color: var(--orange); }
.breed-rows { display: flex; flex-direction: column; gap: 3px; }
.breed-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 2px 5px; border-radius: 4px; background: var(--orange-bg);
}
.breed-row-label { font-size: 8px; font-weight: 600; color: var(--text-2); }
.breed-row-time  { font-size: 11px; font-weight: 800; color: var(--orange); font-variant-numeric: tabular-nums; }
.breed-bar { width: 100%; height: 2px; background: var(--border-1); border-radius: 1px; margin: 3px 0; overflow: hidden; }
.breed-bar-fill { height: 100%; border-radius: 1px; background: linear-gradient(90deg, rgba(245,158,11,0.3), var(--orange)); transition: width 1s linear; }
.breed-start-btn {
  width: 100%; height: 22px; border: none; border-radius: 4px; margin-top: 4px;
  background: var(--orange-bg); color: var(--orange); font-size: 9px; font-weight: 700;
  cursor: pointer; font-family: inherit; text-transform: uppercase; transition: all .1s;
}
.breed-start-btn:hover  { background: rgba(245,158,11,0.14); }
.breed-start-btn.running { background: var(--red-bg); color: var(--red); }

/* ── Resize handle ── */
.resize-handle {
  position: fixed; bottom: 0; right: 0; width: 14px; height: 14px;
  cursor: se-resize; z-index: 100; opacity: 0.2; transition: opacity .2s;
}
.resize-handle:hover { opacity: 0.6; }
.resize-handle::after {
  content: ''; position: absolute; bottom: 2px; right: 2px;
  width: 6px; height: 6px;
  border-right: 1.5px solid var(--text-3); border-bottom: 1.5px solid var(--text-3);
}

/* Scrollbar */
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.07); border-radius: 2px; }

/* ── Noir Theme — Pure Black, Timer Widget Style ── */
html.noir-theme {
  --bg-0:#000000; --bg-1:#0a0a0d; --bg-2:#101014; --bg-3:#181820;
  --border-0:rgba(255,255,255,0.07); --border-1:rgba(255,255,255,0.12); --border-2:rgba(255,255,255,0.20);
  --text-0:#FFFFFF; --text-1:#C0C0CC; --text-2:#70708A; --text-3:#404055;
  --accent:#8BA4FF; --accent-l:#A8BEFF; --accent-d:#6B85E8;
  --accent-bg:rgba(139,164,255,0.12); --accent-border:rgba(139,164,255,0.32);
}
html.noir-theme ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.10); }

/* ── Light Theme ── */
html.light-theme {
  --bg-0:#f5f5f8; --bg-1:rgba(255,255,255,0.92); --bg-2:rgba(245,245,248,0.85); --bg-3:rgba(235,235,242,0.8);
  --border-0:rgba(0,0,0,0.06); --border-1:rgba(0,0,0,0.10); --border-2:rgba(0,0,0,0.15);
  --text-0:#1a1a2e; --text-1:#444466; --text-2:#666688; --text-3:#9090aa;
  --accent:#5B75DA; --accent-l:#7B93F8;
  --accent-bg:rgba(91,117,218,0.10); --accent-border:rgba(91,117,218,0.28);
}
html.light-theme ::-webkit-scrollbar-thumb { background: rgba(91,117,218,0.20); }
</style>
</head>
<body>
<div id="shell">
  <div id="mini-bar">
    <span class="title">
      ⏱ Timers
      <span class="timer-count" id="timerCount">0</span>
    </span>
    <div class="bar-actions">
      <button class="close-btn" onclick="window.api && window.api.timerClose()">✕</button>
    </div>
  </div>

  <div id="timers-area">
    <div id="timersList"></div>

    <div class="empty-state" id="emptyState">
      <div class="empty-ico">⏱</div>
      <div class="empty-title">Aucun timer actif</div>
      <div class="empty-sub">Utilise Quick Lookup → Starve timer<br>ou clique + ci-dessous</div>
    </div>

    <div class="add-row">
      <button class="add-btn" onclick="addManualTimer()">+ Ajouter un timer</button>
    </div>

    <div class="breed-section" id="breedingBlock">
      <div class="breed-head"><span>🥚</span><span class="breed-label">Breeding</span></div>
      <div class="breed-rows">
        <div class="breed-row"><span class="breed-row-label">🥚 Incubation</span><span class="breed-row-time" id="breedInc">--:--:--</span></div>
        <div class="breed-row"><span class="breed-row-label">🍼 Maturation</span><span class="breed-row-time" id="breedMat">--:--:--</span></div>
        <div class="breed-row"><span class="breed-row-label">❤️ Imprinting</span><span class="breed-row-time" id="breedImp">--:--:--</span></div>
        <div class="breed-row"><span class="breed-row-label">⏳ Interval</span><span class="breed-row-time" id="breedInt">--:--:--</span></div>
      </div>
      <div class="breed-bar"><div class="breed-bar-fill" id="breedBar" style="width:0%"></div></div>
      <button class="breed-start-btn" id="breedBtnStart" onclick="breedToggle()">START INCUBATION</button>
    </div>
  </div>
  <div class="resize-handle"></div>
</div>

<script>
// ===== CREATURE ICON RESOLVER (same as quick-lookup) =====
var ICON_SPECIAL = {
  'Therizinosaurus':'Therizinosaur','Spinosaurus':'Spino','Sarcosuchus':'Sarco',
  'Pulmonoscorpius':'Scorpion','Castoroides':'Giant_Beaver','Araneo':'Spider',
  'Compsognathus':'Compy','Triceratops':'Trike','Pachycephalosaurus':'Pachy',
  'Thylacosmilus':'Thylacoleo','Sabertooth Salmon':'Salmon','Megapiranha':'Piranha',
  'DodoRex':'Dodorex','Super Turkey':'Turkey','Royal Griffin':'Griffin',
  'Quetzalcoatlus':'Quetzal','Woolly Rhino':'Woolly_Rhinoceros','Woolly Mammoth':'Mammoth',
  'Tek Quetzal':'Tek_Quetzal','X-Woolly Rhino':'Woolly_Rhinoceros','X-Woolly Mammoth':'Mammoth',
  'Alpha Rex':'Rex','Alpha Raptor':'Raptor','Alpha Carno':'Carnotaurus',
  'Alpha Mosasaur':'Mosasaurus','Alpha Tusoteuthis':'Tusoteuthis',
  'Alpha Leedsichthys':'Leedsichthys','Alpha Megalodon':'Megalodon',
  'Zombie Wyvern':'Wyvern','Skeletal Rex':'Rex','Bunny Dodo':'Dodo',
};
var ICON_BASE = {
  'Therizinosaurus':'Therizinosaur','Spinosaurus':'Spino','Sarcosuchus':'Sarco',
  'Pulmonoscorpius':'Scorpion','Castoroides':'Giant_Beaver','Araneo':'Spider',
  'Compsognathus':'Compy','Triceratops':'Trike','Pachycephalosaurus':'Pachy',
  'Woolly Rhino':'Woolly_Rhinoceros','Woolly Mammoth':'Mammoth','Quetzalcoatlus':'Quetzal',
};
function resolveVariant(name) {
  if (name.startsWith('R-')) { var b=name.slice(2); return ICON_BASE[b]||ICON_SPECIAL[b]||b.replace(/ /g,'_'); }
  if (name.startsWith('Aberrant ')) { var b=name.slice(9); return ICON_BASE[b]||ICON_SPECIAL[b]||b.replace(/ /g,'_'); }
  if (name.startsWith('X-')) { if (ICON_SPECIAL[name]) return ICON_SPECIAL[name]; var b=name.slice(2); return ICON_BASE[b]||ICON_SPECIAL[b]||b.replace(/ /g,'_'); }
  return null;
}
function getIconUrl(name) {
  var v = resolveVariant(name);
  if (v) return 'https://ark.wiki.gg/images/thumb/'+v+'.png/64px-'+v+'.png';
  var w = ICON_SPECIAL[name] || name.replace(/ /g,'_');
  return 'https://ark.wiki.gg/images/thumb/'+w+'.png/64px-'+w+'.png';
}

// ===== STATE =====
var timers = [];
var nextTimerId = 1;
var lastSyncData = null;

// ===== CREATE TIMER =====
function createTimerObj(data) {
  var t = {
    id: 'tm_' + (nextTimerId++),
    dinoName: (data && data.dinoName) || 'Dino #' + nextTimerId,
    foodRequired: (data && data.foodRequired) || '0',
    foodCurrent: parseFloat((data && data.foodCurrent) || 0),
    foodMax: parseFloat((data && data.foodMax) || 0),
    starveTotal: 0, starveLeft: 0, starveRunning: false, starveInterval: null, starveAlarmFired: false,
    torporTotal: 0, torporLeft: 0, torporRunning: false, torporInterval: null, torporAlarmFired: false,
    torporDrainRate: 0,
    torporCurrent: parseFloat((data && data.torporCurrent) || 0),
    torporMax: parseFloat((data && data.torporMax) || 0),
    narcoCount: 0, bioCount: 0
  };
  if (data && data.starveTime) { t.starveTotal = parseTimeStr(data.starveTime); t.starveLeft = t.starveTotal; }
  if (t.starveTotal === 0 && t.foodCurrent > 0) { t.starveTotal = Math.round(t.foodCurrent * 10); t.starveLeft = t.starveTotal; }
  if (data && data.torporTime) { t.torporTotal = parseTimeStr(data.torporTime); t.torporLeft = t.torporTotal; }
  t.torporDrainRate = Math.max(0.1, Math.round((t.torporMax || 1) * 0.03 * 100) / 100);
  if (t.torporTotal === 0 && t.torporCurrent > 0) { t.torporTotal = Math.round(t.torporCurrent / t.torporDrainRate); t.torporLeft = t.torporTotal; }
  return t;
}

// ===== HELPERS =====
function parseTimeStr(str) {
  if (!str) return 0;
  var total = 0;
  var d = str.match(/(\d+)\s*d/i); var h = str.match(/(\d+)\s*h/i);
  var m = str.match(/(\d+)\s*m/i); var s = str.match(/(\d+)\s*s/i);
  if (d) total += parseInt(d[1]) * 86400;
  if (h) total += parseInt(h[1]) * 3600;
  if (m) total += parseInt(m[1]) * 60;
  if (s) total += parseInt(s[1]);
  if (total === 0) {
    var c = str.split(':');
    if (c.length === 3) total = parseInt(c[0])*3600 + parseInt(c[1])*60 + parseInt(c[2]);
    else if (c.length === 2) total = parseInt(c[0])*60 + parseInt(c[1]);
  }
  return total || 0;
}

function fmtTime(sec) {
  sec = Math.max(0, sec);
  var h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  if (h > 0) return h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  return m + ':' + String(s).padStart(2,'0');
}
function formatHMS(sec) {
  if (sec <= 0) return '0:00:00';
  var h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function findTimer(id) { for (var i=0;i<timers.length;i++) if (timers[i].id===id) return timers[i]; return null; }

// ===== RENDER =====
function renderAll() {
  var list = document.getElementById('timersList');
  var empty = document.getElementById('emptyState');
  document.getElementById('timerCount').textContent = timers.length;
  empty.style.display = timers.length === 0 ? 'flex' : 'none';

  var existing = list.querySelectorAll('.timer-card');
  if (existing.length !== timers.length) {
    list.innerHTML = '';
    for (var i = 0; i < timers.length; i++) list.appendChild(buildCard(timers[i]));
  }
  for (var i = 0; i < timers.length; i++) updateCardDisplay(timers[i]);
}

function buildCard(t) {
  var card = document.createElement('div');
  card.className = 'timer-card';
  card.id = 'card-' + t.id;
  var iconUrl = getIconUrl(t.dinoName);
  var iconHtml = '<img class="card-icon" src="' + iconUrl + '" alt="" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'">'
               + '<div class="card-icon-fb" style="display:none">🦖</div>';
  card.innerHTML =
    '<div class="card-head">' +
      iconHtml +
      '<span class="card-dino">' + escHtml(t.dinoName) + '</span>' +
      '<span class="card-status ready" id="st-' + t.id + '">READY</span>' +
      '<button class="card-remove" onclick="removeTimer(\'' + t.id + '\')">✕</button>' +
    '</div>' +
    '<div class="timer-rows">' +
      '<div class="t-row">' +
        '<span class="t-ico">🍖</span>' +
        '<span class="t-label">Starve</span>' +
        '<span class="t-time starve-c" id="sv-' + t.id + '">' + fmtTime(t.starveLeft) + '</span>' +
        '<div class="t-bar"><div class="t-bar-fill starve-fill" id="svb-' + t.id + '" style="width:100%"></div></div>' +
        '<button class="t-btn" id="svt-' + t.id + '" onclick="toggleStarve(\'' + t.id + '\')">▶</button>' +
      '</div>' +
      '<div class="t-row">' +
        '<span class="t-ico">💜</span>' +
        '<span class="t-label">Torpor</span>' +
        '<span class="t-time torpor-c" id="tp-' + t.id + '">' + fmtTime(t.torporLeft) + '</span>' +
        '<div class="t-bar"><div class="t-bar-fill torpor-fill" id="tpb-' + t.id + '" style="width:100%"></div></div>' +
        '<button class="t-btn torpor-s" id="tpt-' + t.id + '" onclick="toggleTorpor(\'' + t.id + '\')">▶</button>' +
      '</div>' +
    '</div>' +
    '<div class="narco-row">' +
      '<button class="narco-btn" onclick="addNarco(\'' + t.id + '\')">💊 +40 <span class="narco-count" id="nc-' + t.id + '">0</span></button>' +
      '<button class="narco-btn" onclick="addBio(\'' + t.id + '\')">☠️ +80 <span class="narco-count" id="bc-' + t.id + '">0</span></button>' +
      '<button class="narco-reset-btn" onclick="resetNarco(\'' + t.id + '\')" title="Reset">↺</button>' +
    '</div>';
  return card;
}

function updateCardDisplay(t) {
  var sv=document.getElementById('sv-'+t.id), tp=document.getElementById('tp-'+t.id);
  var svb=document.getElementById('svb-'+t.id), tpb=document.getElementById('tpb-'+t.id);
  var svt=document.getElementById('svt-'+t.id), tpt=document.getElementById('tpt-'+t.id);
  var st=document.getElementById('st-'+t.id);
  if (!sv) return;

  sv.textContent = fmtTime(t.starveLeft);
  sv.classList.toggle('danger', t.starveLeft <= 30 && t.starveLeft > 0);
  svb.style.width = (t.starveTotal > 0 ? (t.starveLeft/t.starveTotal)*100 : 0) + '%';
  svt.textContent = t.starveRunning ? '⏸' : '▶';
  svt.classList.toggle('running', t.starveRunning);

  tp.textContent = fmtTime(t.torporLeft);
  tp.classList.toggle('danger', t.torporLeft <= 60 && t.torporLeft > 0);
  tpb.style.width = (t.torporTotal > 0 ? (t.torporLeft/t.torporTotal)*100 : 0) + '%';
  tpt.textContent = t.torporRunning ? '⏸' : '▶';
  tpt.classList.toggle('running', t.torporRunning);

  var anyRunning = t.starveRunning || t.torporRunning;
  var ended = (t.starveTotal>0&&t.starveLeft<=0)||(t.torporTotal>0&&t.torporLeft<=0);
  if (ended && !anyRunning) { st.className='card-status done'; st.textContent='DONE'; }
  else if (anyRunning)      { st.className='card-status running'; st.textContent='RUNNING'; }
  else                      { st.className='card-status ready'; st.textContent='READY'; }

  var nc=document.getElementById('nc-'+t.id), bc=document.getElementById('bc-'+t.id);
  if (nc) nc.textContent = t.narcoCount;
  if (bc) bc.textContent = t.bioCount;
}

// ===== TIMER ACTIONS =====
function toggleStarve(id) {
  var t = findTimer(id); if (!t) return;
  if (!t.starveRunning) {
    if (t.starveLeft <= 0 && t.starveTotal > 0) t.starveLeft = t.starveTotal;
    if (t.starveLeft <= 0) return;
    t.starveRunning = true; t.starveAlarmFired = false;
    t.starveInterval = setInterval(function() {
      t.starveLeft--;
      updateCardDisplay(t);
      if (!t.starveAlarmFired && t.starveLeft === 300) { playAlarm(t.dinoName + ' — 5 min restantes'); t.starveAlarmFired = true; }
      if (t.starveLeft <= 0) { clearInterval(t.starveInterval); t.starveRunning = false; playAlarm(t.dinoName + ' est prêt !'); updateCardDisplay(t); }
    }, 1000);
  } else {
    t.starveRunning = false; clearInterval(t.starveInterval);
  }
  updateCardDisplay(t);
}

function toggleTorpor(id) {
  var t = findTimer(id); if (!t) return;
  if (!t.torporRunning) {
    if (t.torporLeft <= 0 && t.torporTotal > 0) t.torporLeft = t.torporTotal;
    if (t.torporLeft <= 0) return;
    t.torporRunning = true; t.torporAlarmFired = false;
    t.torporInterval = setInterval(function() {
      t.torporLeft--;
      updateCardDisplay(t);
      if (!t.torporAlarmFired && t.torporLeft === 300) { playAlarm(t.dinoName + ' — Torpor critique !'); t.torporAlarmFired = true; }
      if (t.torporLeft <= 0) { clearInterval(t.torporInterval); t.torporRunning = false; playAlarm(t.dinoName + ' se réveille !'); updateCardDisplay(t); }
    }, 1000);
  } else {
    t.torporRunning = false; clearInterval(t.torporInterval);
  }
  updateCardDisplay(t);
}

function addNarco(id) {
  var t = findTimer(id); if (!t) return;
  t.torporLeft = Math.min(t.torporTotal, t.torporLeft + Math.round(40/(t.torporDrainRate||0.3)));
  t.narcoCount++; updateCardDisplay(t);
}
function addBio(id) {
  var t = findTimer(id); if (!t) return;
  t.torporLeft = Math.min(t.torporTotal, t.torporLeft + Math.round(80/(t.torporDrainRate||0.3)));
  t.bioCount++; updateCardDisplay(t);
}
function resetNarco(id) {
  var t = findTimer(id); if (!t) return;
  t.narcoCount = 0; t.bioCount = 0; updateCardDisplay(t);
}

function removeTimer(id) {
  var t = findTimer(id);
  if (t) { if (t.starveInterval) clearInterval(t.starveInterval); if (t.torporInterval) clearInterval(t.torporInterval); }
  timers = timers.filter(function(x) { return x.id !== id; });
  var card = document.getElementById('card-' + id);
  if (card) { card.style.opacity = '0'; card.style.transform = 'scaleY(0)'; setTimeout(function() { renderAll(); }, 180); }
  else renderAll();
}

function addManualTimer() {
  var t = createTimerObj(lastSyncData || {});
  timers.push(t); renderAll();
  var area = document.getElementById('timers-area');
  area.scrollTop = area.scrollHeight;
}

// ===== SYNC FROM QUICK LOOKUP / DODODEX =====
if (window.api && window.api.onTimerDataUpdate) {
  window.api.onTimerDataUpdate(function(data) {
    lastSyncData = data;
    if (!data.dinoName) return;

    var existing = null;
    for (var i = 0; i < timers.length; i++) {
      if (timers[i].dinoName === data.dinoName) { existing = timers[i]; break; }
    }

    if (existing) {
      if (!existing.starveRunning && data.starveTime) {
        var sTotal = parseTimeStr(data.starveTime);
        if (sTotal > 0) { existing.starveTotal = sTotal; existing.starveLeft = sTotal; }
      }
      if (!existing.torporRunning && data.torporTime) {
        var tTotal = parseTimeStr(data.torporTime);
        if (tTotal > 0) { existing.torporTotal = tTotal; existing.torporLeft = tTotal; }
      }
      existing.foodRequired = data.foodRequired || existing.foodRequired;
      var card = document.getElementById('card-' + existing.id);
      if (card) { card.classList.add('synced'); setTimeout(function(){ card.classList.remove('synced'); }, 1200); }
      updateCardDisplay(existing);
    } else {
      var t = createTimerObj(data);
      timers.push(t); renderAll();
      var area = document.getElementById('timers-area');
      area.scrollTop = area.scrollHeight;
    }

    // Breeding
    if (data.breeding) {
      var bb = data.breeding;
      var breedBlock = document.getElementById('breedingBlock');
      if (bb.incubation || bb.maturation) breedBlock.classList.add('show');
      if (bb.incubation) { document.getElementById('breedInc').textContent = bb.incubation; if (!breedRunning) breedIncTotal = parseTimeStr(bb.incubation); }
      if (bb.maturation) { document.getElementById('breedMat').textContent = bb.maturation; if (!breedRunning) breedMatTotal = parseTimeStr(bb.maturation); }
      if (bb.imprinting) document.getElementById('breedImp').textContent = bb.imprinting;
      if (bb.interval)   document.getElementById('breedInt').textContent = bb.interval;
    }
  });
}

// ===== BREEDING =====
var breedIncTotal=0, breedIncLeft=0, breedMatTotal=0, breedMatLeft=0;
var breedRunning=false, breedInterval=null, breedAlarmFired=false, breedPhase='incubation';

function breedToggle() {
  var btn = document.getElementById('breedBtnStart');
  if (!breedRunning) {
    if (breedIncTotal <= 0) return;
    breedRunning = true; breedAlarmFired = false;
    breedIncLeft = breedIncTotal; breedMatLeft = breedMatTotal;
    btn.textContent = '⏸ PAUSE'; btn.classList.add('running');
    breedInterval = setInterval(function() {
      if (breedPhase === 'incubation') {
        breedIncLeft--;
        document.getElementById('breedInc').textContent = formatHMS(breedIncLeft);
        var pct = breedIncTotal > 0 ? ((breedIncTotal - breedIncLeft) / breedIncTotal) * 100 : 0;
        document.getElementById('breedBar').style.width = pct + '%';
        if (!breedAlarmFired && breedIncLeft === 300) { playAlarm('Incubation presque terminée'); breedAlarmFired = true; }
        if (breedIncLeft <= 0) { playAlarm('Oeuf éclos !'); breedPhase = 'maturation'; breedAlarmFired = false; }
      } else {
        breedMatLeft--;
        document.getElementById('breedMat').textContent = formatHMS(breedMatLeft);
        var pct2 = breedMatTotal > 0 ? ((breedMatTotal - breedMatLeft) / breedMatTotal) * 100 : 0;
        document.getElementById('breedBar').style.width = pct2 + '%';
        if (!breedAlarmFired && breedMatLeft === 300) { playAlarm('Maturation presque terminée'); breedAlarmFired = true; }
        if (breedMatLeft <= 0) {
          clearInterval(breedInterval); breedRunning = false; breedPhase = 'incubation';
          btn.textContent = 'START INCUBATION'; btn.classList.remove('running');
          playAlarm('Bébé adulte !');
        }
      }
    }, 1000);
  } else {
    breedRunning = false; clearInterval(breedInterval); breedPhase = 'incubation';
    btn.textContent = 'START INCUBATION'; btn.classList.remove('running');
  }
}

// ===== SOUND =====
var soundPreset = 'beep', soundVolume = 0.6;
var SOUND_PRESETS = {
  beep: function(ctx, vol) {
    for (var i=0;i<3;i++) {
      var o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=880; o.type='sine';
      var t=ctx.currentTime+i*0.3;
      g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.2);
      o.start(t); o.stop(t+0.25);
    }
  }
};
function playAlarm(msg) {
  try { var ctx=new AudioContext(); (SOUND_PRESETS[soundPreset]||SOUND_PRESETS.beep)(ctx,soundVolume); } catch(e) {}
  if (window.api && window.api.showNotification && msg) window.api.showNotification({ title:'🦖 ARK Timer', body: msg });
}

// ===== CLICK-THROUGH =====
if (window.api && window.api.onClickThroughChanged) {
  window.api.onClickThroughChanged(function(v) {
    document.getElementById('shell').style.opacity = v ? '0.65' : '1';
  });
}

// ===== AUTO-RESIZE WINDOW TO CONTENT =====
function syncHeight() {
  if (window.api && window.api.timerAutoResize) {
    window.api.timerAutoResize(document.getElementById('shell').scrollHeight);
  }
}
var ro = new ResizeObserver(syncHeight);
ro.observe(document.getElementById('shell'));

// ===== INIT =====
renderAll();
setTimeout(syncHeight, 80);

// ── Theme ──
(function() {
  function applyTheme(t) {
    document.documentElement.classList.remove('noir-theme','light-theme');
    if (t === 'noir' || t === 'light') document.documentElement.classList.add(t + '-theme');
  }
  if (window.api && window.api.getTheme) {
    window.api.getTheme().then(function(t) { applyTheme(t || 'dark'); });
  } else {
    applyTheme(localStorage.getItem('overseer-theme') || 'dark');
  }
  if (window.api && window.api.onThemeChange) {
    window.api.onThemeChange(function(t) { localStorage.setItem('overseer-theme', t); applyTheme(t); });
  }
})();
</script>
